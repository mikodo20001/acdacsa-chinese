# YOLOv8 Dataset Configuration for Cell Detection
# 医学细胞检测数据集配置文件

# 数据集路径
path: ../data  # 数据集根目录
train: train/images  # 训练集图像路径（相对于path）
val: val/images      # 验证集图像路径（相对于path）
test: test/images    # 测试集图像路径（相对于path）

# 类别数量
nc: 3  # number of classes

# 类别名称（三种主要血细胞类别）
names:
  0: RBC  # Red Blood Cell - 红细胞
  1: WBC  # White Blood Cell - 白细胞
  2: Platelet  # Platelet - 血小板
