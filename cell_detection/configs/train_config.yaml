# YOLOv8 Training Configuration
# 训练配置文件

# 模型配置
model: yolov8s.pt  # 预训练权重（s: small, m: medium, l: large, x: xlarge）

# 训练参数
epochs: 100  # 训练轮次
batch_size: 16  # 批次大小
imgsz: 640  # 输入图像大小
workers: 8  # 数据加载线程数
device: 0  # GPU设备编号（0为第一块GPU，cpu为使用CPU）

# 优化器配置
optimizer: AdamW  # 优化器类型
lr0: 0.01  # 初始学习率
lrf: 0.01  # 最终学习率（lr0 * lrf）
momentum: 0.937  # SGD动量/Adam beta1
weight_decay: 0.0005  # 权重衰减

# 数据增强
hsv_h: 0.015  # 色调增强
hsv_s: 0.7    # 饱和度增强
hsv_v: 0.4    # 亮度增强
degrees: 0.0  # 旋转角度
translate: 0.1  # 平移
scale: 0.5    # 缩放
shear: 0.0    # 剪切
perspective: 0.0  # 透视变换
flipud: 0.0   # 上下翻转概率
fliplr: 0.5   # 左右翻转概率
mosaic: 1.0   # Mosaic增强概率
mixup: 0.0    # Mixup增强概率

# 损失函数权重
box: 7.5      # box loss权重
cls: 0.5      # cls loss权重
dfl: 1.5      # dfl loss权重

# 保存配置
save: True  # 保存检查点
save_period: -1  # 每N个epoch保存一次（-1为只保存最后）
project: ../outputs/runs  # 项目保存路径
name: cell_detection  # 实验名称
exist_ok: False  # 是否覆盖已存在的实验

# 验证配置
val: True  # 训练过程中是否验证
plots: True  # 保存训练图表
verbose: True  # 详细输出
